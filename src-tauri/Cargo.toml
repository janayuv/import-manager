[package]
name = "app"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
repository = "https://github.com/janayuv/import-manager"
edition = "2021"
rust-version = "1.71"

build = "build.rs"

[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-build = { version = "2.6", features = [] }

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
rusqlite = { version = "0.31.0", features = ["bundled"] }
paste = "1.0"
keyring = { version = "3.6", default-features = false }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
base64 = "0.21"
hex = "0.4"
refinery = { version = "0.8", features = ["rusqlite"] }

# Keep major.minor aligned with npm `@tauri-apps/api` / CLI (see package.json).
tauri = { version = "2.11.1", features = ["protocol-asset"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2.8"
# Keep in sync with npm `@tauri-apps/plugin-dialog` major.minor (see package.json).
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-updater = "2"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
thiserror = "1.0"
regex = "1.0"
lazy_static = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time"] }
urlencoding = "2.1"
open = "5"
cron = "0.12"
sha2 = "0.10"
fs4 = "0.8"
aes-gcm = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
calamine = "0.25"
strsim = "0.11"
image = "0.25.6"
argon2 = "0.5.3"
bcrypt = "0.15"
rust_decimal = "1"
sysinfo = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
rust_xlsxwriter = "0.66.0"
