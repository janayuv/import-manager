name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CI: true
      LIBSQLITE3_SYS_BUNDLED: '1'
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "Validating tag format..."
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Invalid tag format"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Record release start time
        id: record_release_start
        shell: bash
        run: echo "RELEASE_START=$(date +%s)" >> $GITHUB_ENV

      - name: Generate build metadata
        id: build_metadata
        shell: bash
        run: |
          META_DATE=$(date -u)
          echo "Build metadata:"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Date: ${META_DATE}"

          echo "RELEASE_METADATA_DATE=${META_DATE}" >> "$GITHUB_ENV"
          echo "release_metadata_date=${META_DATE}" >> "$GITHUB_OUTPUT"

          echo "## Build Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Date: ${META_DATE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          LIBSQLITE3_SYS_BUNDLED: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Import Manager ${{ github.ref_name }}'
          releaseBody: |
            ### Build Metadata
            Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Date: ${{ steps.build_metadata.outputs.release_metadata_date }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Sign installer (Windows Authenticode)
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # Import PFX from base64-encoded secret
          $pfxPath = Join-Path $env:RUNNER_TEMP "import-manager-sign.pfx"
          [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:SIGNING_CERTIFICATE))
          # Locate signtool
          $signtool = & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe" 2>$null
          if (-not $signtool) {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $signtool) { $signtool = "signtool.exe" }
          # Sign all MSI and NSIS installers produced by the build
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include "*.msi","*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Signing: $($_.FullName)"
            & $signtool sign /f $pfxPath /p $env:SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName)" }
          }
          Remove-Item $pfxPath -Force
          Write-Host "✅ Authenticode signing complete"

      - name: Show release duration
        if: always() && steps.record_release_start.outcome == 'success'
        shell: bash
        run: |
          END=$(date +%s)
          DURATION=$((END - RELEASE_START))
          echo "Release duration: ${DURATION}s"

          echo "## Release Duration" >> "$GITHUB_STEP_SUMMARY"
          echo "Total release time: ${DURATION} seconds" >> "$GITHUB_STEP_SUMMARY"
