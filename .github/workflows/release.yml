name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HUSKY: '0'
      CI: true
      SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE || '' }}
      # Match CI build job so Tauri + SQLCipher link on Windows runners
      SQLCIPHER_LIB_DIR: C:\vcpkg\installed\x64-windows\lib
      SQLCIPHER_INCLUDE_DIR: C:\vcpkg\installed\x64-windows\include
      LIBSQLITE3_SYS_BUNDLED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate version tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          echo "Validating tag format..."
          if [[ "${GITHUB_REF_NAME}" != v* ]]; then
            echo "Invalid tag format"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Record release start time
        id: record_release_start
        shell: bash
        run: echo "RELEASE_START=$(date +%s)" >> $GITHUB_ENV

      - name: Generate build metadata
        id: build_metadata
        shell: bash
        run: |
          META_DATE=$(date -u)
          echo "Build metadata:"
          echo "Tag: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Date: ${META_DATE}"

          echo "RELEASE_METADATA_DATE=${META_DATE}" >> "$GITHUB_ENV"
          echo "release_metadata_date=${META_DATE}" >> "$GITHUB_OUTPUT"

          echo "## Build Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Date: ${META_DATE}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          SQLCIPHER_LIB_DIR: C:\vcpkg\installed\x64-windows\lib
          SQLCIPHER_INCLUDE_DIR: C:\vcpkg\installed\x64-windows\include
          LIBSQLITE3_SYS_BUNDLED: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Import Manager ${{ github.ref_name }}'
          releaseBody: |
            ### Build Metadata
            Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Date: ${{ steps.build_metadata.outputs.release_metadata_date }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Show release duration
        if: always() && steps.record_release_start.outcome == 'success'
        shell: bash
        run: |
          END=$(date +%s)
          DURATION=$((END - RELEASE_START))
          echo "Release duration: ${DURATION}s"

          echo "## Release Duration" >> "$GITHUB_STEP_SUMMARY"
          echo "Total release time: ${DURATION} seconds" >> "$GITHUB_STEP_SUMMARY"
